<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <!-- Robot body -->
  <rect x="20" y="34" width="40" height="30" rx="6" fill="#1e3a5f"/>
  <!-- Robot head -->
  <rect x="24" y="14" width="32" height="24" rx="6" fill="#1e3a5f"/>
  <!-- Antenna -->
  <line x1="40" y1="14" x2="40" y2="7" stroke="#1e3a5f" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="40" cy="5" r="3" fill="#217346"/>
  <!-- Eyes -->
  <rect x="29" y="20" width="8" height="6" rx="2" fill="#00c853"/>
  <rect x="43" y="20" width="8" height="6" rx="2" fill="#00c853"/>
  <!-- Eye shine -->
  <rect x="30" y="21" width="2" height="2" rx="1" fill="white" opacity="0.7"/>
  <rect x="44" y="21" width="2" height="2" rx="1" fill="white" opacity="0.7"/>
  <!-- Mouth -->
  <rect x="30" y="30" width="20" height="3" rx="1.5" fill="#4a90c4" opacity="0.8"/>
  <!-- Mouth teeth -->
  <rect x="32" y="30" width="3" height="3" rx="0.5" fill="white" opacity="0.5"/>
  <rect x="37" y="30" width="3" height="3" rx="0.5" fill="white" opacity="0.5"/>
  <rect x="42" y="30" width="3" height="3" rx="0.5" fill="white" opacity="0.5"/>
  <!-- Arms -->
  <rect x="8" y="36" width="12" height="8" rx="4" fill="#1e3a5f"/>
  <rect x="60" y="36" width="12" height="8" rx="4" fill="#1e3a5f"/>
  <!-- Legs -->
  <rect x="26" y="62" width="10" height="10" rx="3" fill="#162d4a"/>
  <rect x="44" y="62" width="10" height="10" rx="3" fill="#162d4a"/>
  <!-- Excel badge -->
  <rect x="48" y="48" width="24" height="24" rx="5" fill="#217346"/>
  <text x="60" y="65" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="white">X</text>
  <!-- Excel badge shine -->
  <rect x="48" y="48" width="24" height="6" rx="5" fill="white" opacity="0.12"/>
</svg>
